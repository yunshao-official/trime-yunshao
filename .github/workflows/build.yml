name: Build Trime-Yunshao APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download FireRedASR2 AED model (1.2GB)
        run: |
          set -e
          mkdir -p app/src/main/assets/asr
          cd /tmp
          curl -L --retry 5 --retry-delay 5 --retry-all-errors -H 'User-Agent: Mozilla/5.0' \
            -o m.tar.bz2 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-fire-red-asr2-zh_en-int8-2026-02-26.tar.bz2'
          ls -lh m.tar.bz2
          tar xf m.tar.bz2
          cp sherpa-onnx-fire-red-asr2-zh_en-int8-2026-02-26/encoder.int8.onnx app/src/main/assets/asr/
          cp sherpa-onnx-fire-red-asr2-zh_en-int8-2026-02-26/decoder.int8.onnx app/src/main/assets/asr/
          cp sherpa-onnx-fire-red-asr2-zh_en-int8-2026-02-26/tokens.txt app/src/main/assets/asr/
          echo '=== assets (should be ~1.2GB) ==='
          du -sh app/src/main/assets/asr/
          ls -lh app/src/main/assets/asr/
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build debug APK with model
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dspotless.check.skip=true 2>&1 | tail -25
          echo '=== APK ==='
          ls -lh app/build/outputs/apk/debug/
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asr-${{ github.run_number }}
          name: Trime-Yunshao ASR v${{ github.run_number }}
          body: '离线语音识别版：FireRedASR2 AED int8 已内置，全本地零联网'
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

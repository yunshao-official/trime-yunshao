name: Build Trime-Yunshao ASR
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download SenseVoice model from our release
        run: |
          set -e
          mkdir -p app/src/main/assets/asr
          cd app/src/main/assets/asr
          BASE='https://github.com/yunshao-official/trime-yunshao/releases/download/model-sensevoice'
          for f in model.int8.onnx tokens.txt; do
            echo "downloading $f"
            for i in 1 2 3 4 5; do
              if curl -fL --retry 3 --retry-delay 5 -o "$f" "$BASE/$f"; then
                echo "$f ok"; break
              fi
              echo "retry $i"; sleep 8
            done
          done
          ls -lh
          du -sh .
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dspotless.check.skip=true 2>&1 | tail -25
          ls -lh app/build/outputs/apk/debug/
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asr-${{ github.run_number }}
          name: Trime-Yunshao ASR v${{ github.run_number }}
          body: 'SenseVoice 227MB 内置 · 中英日韩粤 · RTF 0.033 · 全本地零联网'
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

name: Build Trime-Yunshao ASR
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download SenseVoice model (227MB)
        run: |
          set -e
          mkdir -p app/src/main/assets/asr
          cd /tmp
          for i in 1 2 3 4 5; do
            echo "attempt $i"
            if curl -L --retry 3 --retry-delay 5 --retry-all-errors -H 'User-Agent: Mozilla/5.0' \
              -o m.tar.bz2 \
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2'; then
              SZ=$(stat -c%s m.tar.bz2 2>/dev/null || echo 0)
              echo "size=$SZ"
              if [ "$SZ" -gt 150000000 ]; then break; fi
            fi
            sleep 10
          done
          ls -lh m.tar.bz2
          tar xf m.tar.bz2
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/model.int8.onnx app/src/main/assets/asr/
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/tokens.txt app/src/main/assets/asr/
          echo '=== assets ==='
          du -sh app/src/main/assets/asr/
          ls -lh app/src/main/assets/asr/
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dspotless.check.skip=true 2>&1 | tail -25
          ls -lh app/build/outputs/apk/debug/
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asr-${{ github.run_number }}
          name: Trime-Yunshao ASR v${{ github.run_number }}
          body: 'SenseVoice 227MB 内置 · 中英日韩粤 · RTF 0.033 · 全本地零联网'
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
